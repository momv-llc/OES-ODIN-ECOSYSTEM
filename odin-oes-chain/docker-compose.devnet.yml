name: oes-devnet
services:
  init:
    build:
      context: .
      dockerfile: infra/devnet/Dockerfile
    entrypoint: ["/usr/local/bin/oes-devnet-init"]
    volumes:
      - validator1-data:/validator1
      - validator2-data:/validator2
      - validator3-data:/validator3
      - devnet-shared:/shared
  validator-1:
    build:
      context: .
      dockerfile: infra/devnet/Dockerfile
    environment:
      OES_HOME: /root/.oesd
      OES_NODE_NAME: validator-1
      OES_P2P_PORT: 26656
    depends_on: [init]
    ports: ["26657:26657"]
    volumes:
      - validator1-data:/root/.oesd
      - devnet-shared:/shared:ro
  validator-2:
    build:
      context: .
      dockerfile: infra/devnet/Dockerfile
    environment:
      OES_HOME: /root/.oesd
      OES_NODE_NAME: validator-2
      OES_P2P_PORT: 26656
    depends_on: [init]
    ports: ["26667:26657"]
    volumes:
      - validator2-data:/root/.oesd
      - devnet-shared:/shared:ro
  validator-3:
    build:
      context: .
      dockerfile: infra/devnet/Dockerfile
    environment:
      OES_HOME: /root/.oesd
      OES_NODE_NAME: validator-3
      OES_P2P_PORT: 26656
    depends_on: [init]
    ports: ["26677:26657"]
    volumes:
      - validator3-data:/root/.oesd
      - devnet-shared:/shared:ro
volumes:
  validator1-data:
  validator2-data:
  validator3-data:
  devnet-shared:
